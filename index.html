<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Learning Catalogue</title>
    <style>
      :root {
        --bg: #f4f8ff;
        --card: #ffffff;
        --text: #1f2d3d;
        --muted: #586b82;
        --primary: #1b5fff;
        --primary-dark: #153eae;
        --accent: #1dc6b8;
        --soft: #edf4ff;
        --border: #dfe9f7;
        --shadow: 0 16px 40px rgba(23, 42, 82, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef5ff 0%, #f8fbff 100%);
        color: var(--text);
      }

      .container {
        max-width: 1250px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      .hero {
        background: linear-gradient(135deg, #0c4ab7, #1b5fff 55%, #2d8cff);
        border-radius: 26px;
        color: #fff;
        padding: 42px 38px;
        box-shadow: var(--shadow);
        margin-bottom: 28px;
      }

      .hero h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
      }

      .hero p {
        margin: 0;
        max-width: 760px;
        font-size: 1.08rem;
        line-height: 1.7;
        color: rgba(255,255,255,0.9);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        background: rgba(255,255,255,0.13);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        margin: 28px 0 24px;
      }

      label {
        font-weight: 800;
        color: var(--text);
      }

      .filter {
        padding: 12px 16px;
        min-width: 250px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
        box-shadow: 0 8px 18px rgba(30, 58, 138, 0.04);
      }

      .materials-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 22px;
      }

      .material-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px 20px 18px;
        box-shadow: var(--shadow);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .material-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 22px 40px rgba(25, 41, 74, 0.12);
      }

      .material-category {
        display: inline-block;
        background: var(--soft);
        color: var(--primary-dark);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        margin-bottom: 12px;
      }

      .material-card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
        line-height: 1.4;
      }

      .material-card p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
      }

      .material-card a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 125%);
        color: white;
        font-weight: 700;
        padding: 11px 16px;
        border-radius: 10px;
      }

      .empty-state {
        grid-column: 1 / -1;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .hero { padding: 28px 20px; }
      }
    </style>
    <script type="module">
      import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@1/dist/index.js';
      inject();
    </script>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>University Learning Catalogue</h1>
        <p>Access well-structured academic notes and learning resources across Computing, Mathematics, Electronics, and Engineering fundamentals. This platform is designed to help students study effectively and revise with clarity.</p>
        <div class="meta-row">
          <span class="badge">Study notes</span>
          <span class="badge">Exam-ready</span>
          <span class="badge">Digital learning</span>
        </div>
      </header>

      <div class="controls">
        <label for="category">Filter by category</label>
        <select id="category" class="filter" aria-label="Filter by category"></select>
      </div>

      <section id="material-list" class="materials-grid" aria-live="polite"></section>
    </main>

    <script>
      const materials = [
        { title: 'BCS 111: Introduction to Programming', category: 'Computing & Informatics', description: 'Programming foundations, algorithms, control structures, functions, arrays, and debugging essentials.', url: './materials/bcs-111-introduction-to-programming.html' },
        { title: 'BCS 113: Electronics', category: 'Engineering & Technology', description: 'Core electronics concepts, circuits, semiconductors, Ohm’s law, AC/DC, and practical applications.', url: './materials/bcs-113-electronics.html' },
        { title: 'MAT 121: Differential Calculus', category: 'Mathematics', description: 'Limits, derivatives, differentiation rules, optimization, and applications of change.', url: './materials/mat-121-differential-calculus.html' },
        { title: 'BCS 116: Electrical Principles', category: 'Engineering & Technology', description: 'Electrical power, circuits, magnetism, safety, energy calculations, and fundamental theory.', url: './materials/bcs-116-electrical-principles.html' },
        { title: 'BCS 121: Discrete Structure 1', category: 'Computing & Informatics', description: 'Sets, relations, functions, logic, counting principles, and mathematical reasoning for computing.', url: './materials/bcs-121-discrete-structure-1.html' },
        { title: 'BCS 114: Introduction to Internet and Technology', category: 'Computing & Informatics', description: 'Internet history, networking, web technologies, security, protocols, and digital systems overview.', url: './materials/bcs-114-introduction-to-internet-technology.html' },
        { title: 'Quantitative Skills 1', category: 'Mathematics', description: 'Number systems, sets, fractions, properties of real numbers, and quantitative reasoning.', url: './materials/qs-1-quantitative-skills.html' },
        { title: 'Khan Academy', category: 'Mathematics', description: 'Free lessons and exercises for algebra, calculus, statistics, and general mathematics.', url: 'https://www.khanacademy.org/' },
        { title: 'MIT OpenCourseWare', category: 'Computing & Informatics', description: 'Open lectures, assignments, and notes from MIT on computer science and engineering.', url: 'https://ocw.mit.edu/' },
        { title: 'freeCodeCamp', category: 'Computing & Informatics', description: 'Practical coding and software engineering resources for beginners and intermediate learners.', url: 'https://www.freecodecamp.org/' },
        { title: 'OpenStax', category: 'Science & Health', description: 'Open educational textbooks covering science, mathematics, and support subjects.', url: 'https://openstax.org/' },
        { title: 'Coursera', category: 'Skills', description: 'Short online courses and structured learning material for academic and career development.', url: 'https://www.coursera.org/' }
      ];

      const categorySelect = document.getElementById('category');
      const materialList = document.getElementById('material-list');

      if (categorySelect && materialList) {
        const categories = ['all', ...new Set(materials.map((item) => item.category))];

        categorySelect.innerHTML = categories
          .map((category) => {
            const label = category === 'all' ? 'All categories' : category;
            return `<option value="${category}">${label}</option>`;
          })
          .join('');

        function renderMaterials(selectedCategory = 'all') {
          const visibleMaterials =
            selectedCategory === 'all'
              ? materials
              : materials.filter((item) => item.category === selectedCategory);

          if (!visibleMaterials.length) {
            materialList.innerHTML = '<div class="empty-state">No resources found in this category.</div>';
            return;
          }

          materialList.innerHTML = visibleMaterials
            .map(
              (item) => `
                <article class="material-card">
                  <div><span class="material-category">${item.category}</span></div>
                  <h3>${item.title}</h3>
                  <p>${item.description}</p>
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer">Open resource</a>
                </article>
              `
            )
            .join('');
        }

        categorySelect.addEventListener('change', (event) => {
          renderMaterials(event.target.value);
        });

        renderMaterials();
      }
    </script>
  </body>
</html>
