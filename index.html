<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Learning Catalogue</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --card: #ffffff;
        --text: #1d2a3a;
        --muted: #5f7084;
        --primary: #1b5fff;
        --primary-soft: #eaf1ff;
        --border: #dfe8f7;
        --shadow: 0 10px 30px rgba(29, 42, 58, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      .header { margin-bottom: 28px; }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 24px 0 30px;
      }

      label { font-weight: 700; }

      .filter {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
        min-width: 220px;
      }

      .materials-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .material-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .material-card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .material-category {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        margin: 0 0 12px;
      }

      .material-card p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.6;
      }

      .material-card a {
        display: inline-block;
        text-decoration: none;
        background: var(--primary);
        color: white;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 10px;
      }

      .empty-state {
        grid-column: 1 / -1;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>University Learning Catalogue</h1>
        <p class="subtitle">Explore academic resources across schools, subjects, and learning support areas.</p>
      </header>

      <div class="controls">
        <label for="category">Filter by category</label>
        <select id="category" class="filter" aria-label="Filter by category"></select>
      </div>

      <section id="material-list" class="materials-grid" aria-live="polite"></section>
    </main>

    <script>
      const materials = [
        { title: 'KICD curriculum designs', category: 'Computing & Informatics', description: 'Official curriculum guidance and structured learning frameworks for academic planning and study design.', url: 'https://kicd.ac.ke/' },
        { title: 'Kenya Education Cloud', category: 'Education', description: 'Digital learning content and academic support resources for school and university learners.', url: 'https://kec.ac.ke/' },
        { title: 'Khan Academy', category: 'Mathematics', description: 'Free lessons, exercises, and practice for algebra, calculus, statistics, and more.', url: 'https://www.khanacademy.org/' },
        { title: 'OpenStax', category: 'Science & Health', description: 'Open-access textbooks and reading material for science, health, and technical subjects.', url: 'https://openstax.org/' },
        { title: 'MIT OpenCourseWare', category: 'Computing & Informatics', description: 'Free course notes, lectures, assignments, and readings from MIT.', url: 'https://ocw.mit.edu/' },
        { title: 'freeCodeCamp', category: 'Computing & Informatics', description: 'Hands-on web development, programming, and software engineering practice.', url: 'https://www.freecodecamp.org/' },
        { title: 'CS50', category: 'Computing & Informatics', description: 'Introductory computer science course covering programming and core computing concepts.', url: 'https://cs50.harvard.edu/x/' },
        { title: 'Open Library', category: 'Skills', description: 'Open digital library for textbooks, reference material, and academic reading.', url: 'https://openlibrary.org/' },
        { title: 'Codecademy', category: 'Computing & Informatics', description: 'Practice-based learning for coding, technology, and digital problem-solving.', url: 'https://www.codecademy.com/' },
        { title: 'Study Stack', category: 'Exam Prep', description: 'Revision cards and self-test tools for building quick recall and exam revision.', url: 'https://www.studystack.com/' },
        { title: 'Coursera', category: 'Skills', description: 'Open and university-linked course content for academic and career learning.', url: 'https://www.coursera.org/' },
        { title: 'Canva Design School', category: 'Social Sciences & Arts', description: 'Design and visual communication tutorials for media, branding, and creative studies.', url: 'https://www.canva.com/designschool/' },
        { title: 'BCS 114: Introduction to Internet and Technology', category: 'Computing & Informatics', description: 'Course notes covering internet basics, protocols, networking, security, and web technologies.', url: './materials/bcs-114-introduction-to-internet-technology.html' },
        { title: 'Quantitative Skills 1', category: 'Mathematics', description: 'Number systems, sets, fractions, and mathematical reasoning for quantitative skill development.', url: './materials/qs-1-quantitative-skills.html' },
        { title: 'BCS 111: Introduction to Programming', category: 'Computing & Informatics', description: 'Programming fundamentals, problem solving, control flow, arrays, functions, and structured software development.', url: './materials/bcs-111-introduction-to-programming.html' },
        { title: 'BCS 113: Electronics', category: 'Engineering & Technology', description: 'Core electronics concepts including circuits, components, semiconductors, analog and digital principles.', url: './materials/bcs-113-electronics.html' },
        { title: 'MAT 121: Differential Calculus', category: 'Mathematics', description: 'Limits, continuity, derivatives, and their applications in optimization, motion, and change.', url: './materials/mat-121-differential-calculus.html' },
        { title: 'BCS 116: Electrical Principles', category: 'Engineering & Technology', description: 'Electricity basics, Ohm’s law, circuits, power, energy, magnetism, and electrical measurement.', url: './materials/bcs-116-electrical-principles.html' },
        { title: 'BCS 121: Discrete Structure 1', category: 'Computing & Informatics', description: 'Logic, sets, relations, functions, counting principles, and mathematical proof foundations.', url: './materials/bcs-121-discrete-structure-1.html' }
      ];

      const categorySelect = document.getElementById('category');
      const materialList = document.getElementById('material-list');

      if (categorySelect && materialList) {
        const categories = ['all', ...new Set(materials.map((item) => item.category))];

        categorySelect.innerHTML = categories
          .map((category) => {
            const label = category === 'all' ? 'All categories' : category;
            return `<option value="${category}">${label}</option>`;
          })
          .join('');

        function renderMaterials(selectedCategory = 'all') {
          const visibleMaterials =
            selectedCategory === 'all'
              ? materials
              : materials.filter((item) => item.category === selectedCategory);

          if (!visibleMaterials.length) {
            materialList.innerHTML = '<div class="empty-state">No resources found in this category.</div>';
            return;
          }

          materialList.innerHTML = visibleMaterials
            .map(
              (item) => `
                <article class="material-card">
                  <div><span class="material-category">${item.category}</span></div>
                  <h3>${item.title}</h3>
                  <p>${item.description}</p>
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer">Open resource</a>
                </article>
              `
            )
            .join('');
        }

        categorySelect.addEventListener('change', (event) => {
          renderMaterials(event.target.value);
        });

        renderMaterials();
      }
    </script>
  </body>
</html>
